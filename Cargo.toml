[package]
name = "objtools"
version = "0.1.0"
edition = "2021"
description = "Disk-backed OBJ and VRML importer for georeferenced glTF assets"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tga", "tiff", "webp", "gif", "pnm", "hdr", "dds", "ico", "qoi", "exr"] }

[profile.release]
lto = true
codegen-units = 1
