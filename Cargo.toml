[package]
name = "objtools"
version = "0.1.0"
edition = "2021"
description = "Streaming command-line tools for very large Wavefront OBJ files"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
